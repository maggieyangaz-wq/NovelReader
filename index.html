<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>小说阅读器</title>
    <script type="module" src="/src/main.ts"></script>
</head>
<body>
    <div id="storage-notice" class="storage-notice" role="status" hidden>此浏览器暂时无法保存阅读记录，本次仍可继续阅读。</div>
    <!-- 头部 -->
    <div class="header">
        <div class="header-content">
            <h1>📚 小说阅读器</h1>
            <div class="header-buttons">
                <button class="header-btn" id="theme-btn" aria-pressed="false">🌙 夜间模式</button>
                <button class="header-btn" id="home-btn">首页</button>
            </div>
        </div>
    </div>

    <!-- 书单列表页面 -->
    <main id="novel-list-page" class="novel-list-page">
        <h2 class="section-title">我的书库</h2>
        <div id="novels-grid" class="novels-grid"></div>
    </main>

    <!-- 阅读页面 -->
    <main id="reader-page" class="reader-page" hidden>
        <div class="reader-header">
            <div class="reader-header-title" id="reader-title"></div>
            <div class="reader-header-buttons">
                <button class="reader-btn" id="quick-bookmark-btn" aria-label="添加本页书签" aria-pressed="false" title="快速加书签">♡</button>
                <button class="reader-btn" id="toc-btn">📑 目录</button>
                <button class="reader-btn" id="bookmark-btn">🔖 书签</button>
                <button class="reader-btn" id="settings-btn">⚙️ 设置</button>
            </div>
        </div>
        <div class="reader-content" id="reader-content" tabindex="-1"></div>
        <div class="reader-footer">
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="progress-text">
                    <span id="progress-text">进度: 0%</span>
                </div>
            </div>
            <div class="footer-buttons">
                <button class="footer-btn" id="prev-btn">← 上一页</button>
                <button class="footer-btn" id="next-btn">下一页 →</button>
            </div>
        </div>
    </main>

    <!-- 目录侧栏 -->
    <aside id="toc-sidebar" class="toc-sidebar" aria-label="章节目录" aria-hidden="true" inert>
        <div class="toc-header">
            章节目录
            <button class="toc-close" id="toc-close">✕</button>
        </div>
        <div class="toc-list" id="toc-list"></div>
    </aside>

    <!-- 书签侧栏 -->
    <aside id="bookmarks-sidebar" class="bookmarks-sidebar" aria-label="我的书签" aria-hidden="true" inert>
        <div class="bookmarks-header">
            我的书签
            <button class="toc-close" id="bookmarks-close">✕</button>
        </div>
        <div class="bookmarks-list" id="bookmarks-list"></div>
    </aside>

    <!-- 密码输入模态框 -->
    <div id="password-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="password-title" aria-hidden="true" inert>
        <div class="modal-content">
            <div class="modal-title" id="password-title">输入密钥以解密</div>
            <input type="password" id="password-input" aria-label="小说密钥" class="modal-input" placeholder="请输入密钥">
            <div class="modal-error" id="password-error" role="alert"></div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" id="password-cancel">取消</button>
                <button class="modal-btn modal-btn-confirm" id="password-confirm">确认</button>
            </div>
        </div>
    </div>

    <!-- 设置模态框 -->
    <div id="settings-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title" aria-hidden="true" inert>
        <div class="modal-content">
            <div class="modal-title" id="settings-title">阅读设置</div>
            <div class="setting-group">
                <label for="font-size-slider">字体大小</label>
                <input type="range" id="font-size-slider" min="12" max="24" value="16">
                <div class="setting-value">当前: <span id="font-size-display">16</span>px</div>
            </div>
            <div class="setting-group">
                <label for="line-height-slider">行距</label>
                <input type="range" id="line-height-slider" min="1.2" max="2.5" step="0.1" value="1.8">
                <div class="setting-value">当前: <span id="line-height-display">1.8</span></div>
            </div>
            <div class="setting-group">
                <label for="chars-per-page-slider">每页字数</label>
                <input type="range" id="chars-per-page-slider" min="500" max="3000" step="100" value="1500">
                <div class="setting-value">当前: <span id="chars-per-page-display">1500</span>字</div>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-confirm" id="settings-close">关闭</button>
            </div>
        </div>
    </div>


</body>
</html>
